# PowerSync Service config (self-hosted) — Phase 4
# Sync Streams format (v1.24+) with auth.user_id() for per-user scoping.
# Reference: https://docs.powersync.com/sync/streams/overview

port: 8080

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URL
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_DATABASE_URL
  sslmode: disable

client_auth:
  # Audiences the JWTs must carry. When set, tokens without a matching `aud`
  # claim are rejected (PSYNC_S2105).
  audience:
    - powersync
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: funds-hs256
        k: !env PS_JWT_SECRET_B64URL

sync_config:
  content: |
    config:
      edition: 3

    streams:
      accounts:
        auto_subscribe: true
        query: SELECT * FROM accounts WHERE user_id = auth.user_id()
      categories:
        auto_subscribe: true
        query: SELECT * FROM categories WHERE user_id = auth.user_id()
      category_budgets:
        auto_subscribe: true
        query: SELECT * FROM category_budgets WHERE user_id = auth.user_id()
      transactions:
        auto_subscribe: true
        query: SELECT * FROM transactions WHERE user_id = auth.user_id()
      transfers:
        auto_subscribe: true
        query: SELECT * FROM transfers WHERE user_id = auth.user_id()
      trades:
        auto_subscribe: true
        query: SELECT * FROM trades WHERE user_id = auth.user_id()
      templates:
        auto_subscribe: true
        query: SELECT * FROM templates WHERE user_id = auth.user_id()
      scheduled_transactions:
        auto_subscribe: true
        query: SELECT * FROM scheduled_transactions WHERE user_id = auth.user_id()
      push_subscriptions:
        auto_subscribe: true
        query: SELECT * FROM push_subscriptions WHERE user_id = auth.user_id()
