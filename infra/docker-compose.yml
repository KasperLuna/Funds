# Fund s — service topology (architecture.md §2)
# Env supplied via .env (see .env.example). All services on default compose network.
# Ingress: cloudflared runs ON THE HOST (systemd), token-managed, ingress rules
# in CF Zero Trust: hostname catch-all -> http://localhost:$WEB_HOST_PORT (13000).
# Host ports bound to 127.0.0.1 only (cloudflared + CI migrate/health + local dev).
# Host-side port configurable via .env: WEB_HOST_PORT (default 13000).
name: funds

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # cavetail: cap so a runaway container restarts instead of OOM-ing the host
    # (host is also a proxy; must stay up).
    mem_limit: 512m
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    # cavetail: image built+published by .githooks/pre-commit (linux/amd64 ->
    # ghcr.io); the host never builds. build: context kept for local dev only.
    image: ghcr.io/kasperluna/funds-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: ./..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13000}:3000"
    env_file: .env

  worker:
    # cavetail: image built+published by .githooks/pre-commit like web; hourly
    # reminder/cleanup loop (ops/worker). No ports, DB + push only.
    image: ghcr.io/kasperluna/funds-worker:${WEB_IMAGE_TAG:-latest}
    build:
      context: ./..
      dockerfile: ops/worker/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env

volumes:
  pgdata:
