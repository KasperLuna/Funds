# Fund s — service topology (architecture.md §2)
# Env supplied via .env (see .env.example). All services on default compose network.
name: funds

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # cavetail: enable in P3
  # web:
  #   build:
  #     context: ./../apps/web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"

  # cavetail: enable in P4
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # cavetail: config-mount + POWERSYNC_CONFIG_PATH is the documented compose pattern
      - ./powersync.yaml:/config/powersync.yaml:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      # cavetail: service only interpolates `PS_*` vars via `!env` in powersync.yaml,
      # so the generic .env vars are mapped onto PS_-prefixed names here.
      PS_DATABASE_URL: ${DATABASE_URL}
      PS_JWT_SECRET_B64URL: ${POWER_SYNC_JWT_SECRET_B64URL}

  # cavetail: enable in P4
  # worker:
  #   build:
  #     context: ./../apps/web
  #   restart: unless-stopped
  #   command: ["node", "worker.js"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
