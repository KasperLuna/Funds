# Fund s — service topology (architecture.md §2)
# Env supplied via .env (see .env.example). All services on default compose network.
# Ingress: cloudflared runs ON THE HOST (systemd), token-managed, ingress rules
# in CF Zero Trust: hostname catch-all -> http://localhost:3000,
# path /sync/* -> http://localhost:8080.
# Host ports bound to 127.0.0.1 only (cloudflared + CI migrate/health + local dev).
# Host-side ports configurable via .env: WEB_HOST_PORT (default 13000),
# POWERSYNC_HOST_PORT (default 18080) — chosen to avoid common collisions.
name: funds

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ./..
      dockerfile: apps/web/Dockerfile
      # cavetail: persist buildkit layers across runs -> repeat deploys skip
      # pnpm install + next build (first run populates cache).
      cache_from:
        - type=local,src=web-buildcache
      cache_to:
        - type=local,dest=web-buildcache,mode=min
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13000}:3000"
    env_file: .env

  # cavetail: enable in P4
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POWERSYNC_HOST_PORT:-18080}:8080"
    volumes:
      # cavetail: config-mount + POWERSYNC_CONFIG_PATH is the documented compose pattern
      - ./powersync.yaml:/config/powersync.yaml:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      # cavetail: service only interpolates `PS_*` vars via `!env` in powersync.yaml,
      # so the generic .env vars are mapped onto PS_-prefixed names here.
      PS_DATABASE_URL: ${PS_DATABASE_URL}
      PS_JWT_SECRET_B64URL: ${POWER_SYNC_JWT_SECRET_B64URL}

  worker:
    build:
      context: ./../ops/worker-stub
    restart: unless-stopped

volumes:
  pgdata:
