name: Deploy
# Bare deploy pipeline only. lint/typecheck/test run in .githooks/pre-commit
# (git config core.hooksPath .githooks) — keeps the OOM-prone proxy host free
# for the build; a broken commit is gated locally instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write infra/.env from secret
        run: printf '%s\n' "${ENV_FILE}" > infra/.env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      # cavetail: OOM-prone host (also a proxy). Free RAM + disk before build.
      - run: docker compose -f infra/docker-compose.yml down --remove-orphans
      - run: docker image prune -af && docker builder prune -af
      - run: docker compose -f infra/docker-compose.yml build
      # cavetail: migrate runs on host against localhost:5432, so postgres must
      # be up first (fresh box has nothing running).
      - run: docker compose -f infra/docker-compose.yml up -d postgres
      - run: |
          for i in $(seq 1 120); do
            docker compose -f infra/docker-compose.yml exec -T postgres pg_isready >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f infra/docker-compose.yml exec -T postgres pg_isready || {
            docker ps -a
            docker compose -f infra/docker-compose.yml logs postgres | tail -40
            exit 1
          }
      # cavetail: host-side migrate needs localhost; web container needs
      # postgres: (service DNS). Same var, two scopes -> own secret.
      - run: pnpm --filter @funds/db run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: docker compose -f infra/docker-compose.yml up -d
      - run: |
          PORT="${WEB_HOST_PORT:-$(sed -n 's/^WEB_HOST_PORT=//p' infra/.env)}"
          PORT="${PORT:-13000}"
          TIMEOUT=60
          ELAPSED=0
          until curl -fsS "http://localhost:${PORT}/api/health" >/dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then exit 1; fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done