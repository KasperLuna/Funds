name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write infra/.env from secret
        run: printf '%s\n' "${ENV_FILE}" > infra/.env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      # cavetail: db tests target localhost:54329/funds_test (packages/db convention);
      # throwaway container keeps them off the deployed postgres.
      - name: Start throwaway test Postgres
        run: |
          docker rm -f funds-test-pg >/dev/null 2>&1 || true
          docker run -d --name funds-test-pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=funds_test \
            -p 127.0.0.1:54329:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec funds-test-pg pg_isready -U postgres -d funds_test >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec funds-test-pg pg_isready -U postgres -d funds_test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cleanup test Postgres
        if: always()
        run: docker rm -f funds-test-pg
      - run: docker compose -f infra/docker-compose.yml build
      # cavetail: host-side migrate needs localhost; web container needs
      # postgres: (service DNS). Same var, two scopes -> own secret.
      - run: pnpm --filter @funds/db run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: docker compose -f infra/docker-compose.yml up -d
      - run: |
          PORT="${WEB_HOST_PORT:-$(sed -n 's/^WEB_HOST_PORT=//p' infra/.env)}"
          PORT="${PORT:-13000}"
          TIMEOUT=60
          ELAPSED=0
          until curl -fsS "http://localhost:${PORT}/api/health" >/dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then exit 1; fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
