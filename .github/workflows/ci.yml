name: Deploy
# Bare deploy pipeline. Images are built+published to ghcr.io by
# .githooks/pre-commit (linux/amd64); this host never builds — it only pulls
# and runs, which keeps the OOM-prone proxy host stable. lint/typecheck/test
# also run in pre-commit (git config core.hooksPath .githooks).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # cavetail: fail fast with a real signal instead of silently hanging when
      # the VPS is out of disk/RAM. A self-hosted runner that stalls is usually
      # a full disk or OOM — surface it before any build work.
      - name: Host health check
        run: |
          set -euo pipefail
          df -h / | tail -1
          printf 'DISK_FREE_PCT='; df / | tail -1 | awk '{print 100-$5}'
          D=$(df / | tail -1 | awk '{print $5}' | tr -d '%')
          if [ "$D" -ge 90 ]; then
            echo "ERROR: / is ${D}% full; run docker system prune + clear pnpm store" >&2
            exit 1
          fi
          free -m 2>/dev/null | head -2 || true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write infra/.env from secret
        run: printf '%s\n' "${ENV_FILE}" > infra/.env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - name: Login to GHCR
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u KasperLuna --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # cavetail: pull BEFORE any teardown — a failed pull leaves the running
      # stack untouched. down+prune afterwards frees RAM and old images; the
      # host never builds.
      - run: docker compose -f infra/docker-compose.yml pull
      # cavetail: down --remove-orphans errors when an orphan is already
      # stopped ("cannot stop container ... is not running"), which aborts the
      # whole deploy before migrate/check. Force-remove any leftover project
      # containers first (docker rm -f works on stopped containers too) so a
      # stale container (e.g. the old powersync) can never block a deploy.
      - run: |
          docker rm -f $(docker ps -aq --filter "label=com.docker.compose.project=funds") 2>/dev/null || true
          docker compose -f infra/docker-compose.yml down --remove-orphans
      - run: docker image prune -af
      # cavetail: postgres won't start with wal_level=replica while an orphaned
      # logical replication slot (left by the old PowerSync service) exists
      # ("logical replication slot ... exists, but wal_level < logical").
      # Chicken-and-egg: the slot can only be dropped while postgres runs with
      # wal_level=logical. Bootstrap a throwaway postgres on the same pgdata with
      # wal_level=logical, drop any stale powersync_* slots, then remove it so the
      # normal container starts clean. No-op on healthy hosts.
      - name: Drop stale PowerSync replication slots
        run: |
          set -euo pipefail
          set -a; source infra/.env; set +a
          docker rm -f $(docker ps -aq --filter "label=com.docker.compose.project=funds") 2>/dev/null || true
          docker run -d --rm --name funds-slot-fix \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -v funds_pgdata:/var/lib/postgresql/data \
            postgres:16-alpine -c wal_level=logical
          for i in $(seq 1 60); do
            docker exec funds-slot-fix pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec funds-slot-fix psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT pg_drop_replication_slot(slot_name) FROM pg_replication_slots WHERE slot_name LIKE 'powersync_%'" || true
          docker rm -f funds-slot-fix
      # cavetail: migrate runs on host against localhost:5432, so postgres must
      # be up first (fresh box has nothing running).
      - run: docker compose -f infra/docker-compose.yml up -d --no-build postgres
      - run: |
          for i in $(seq 1 120); do
            docker compose -f infra/docker-compose.yml exec -T postgres pg_isready >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f infra/docker-compose.yml exec -T postgres pg_isready || {
            docker ps -a
            docker compose -f infra/docker-compose.yml logs postgres | tail -40
            exit 1
          }
      # cavetail: host-side migrate needs localhost; web container needs
      # postgres: (service DNS). Same var, two scopes -> own secret.
      - run: pnpm --filter @funds/db run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Schema drift check: fail the deploy loudly if a migration was generated
      # but never applied (e.g. out-of-band DB with no drizzle tracking), instead
      # of shipping code that writes columns the DB lacks.
      - run: pnpm --filter @funds/db run check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: docker compose -f infra/docker-compose.yml up -d --no-build
      - run: |
          PORT="${WEB_HOST_PORT:-$(sed -n 's/^WEB_HOST_PORT=//p' infra/.env)}"
          PORT="${PORT:-13000}"
          TIMEOUT=60
          ELAPSED=0
          until curl -fsS "http://localhost:${PORT}/api/health" >/dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then exit 1; fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
      # cavetail: the silent killer on a long-lived self-hosted VPS is disk
      # growth that survives `image prune -af`: pnpm store, the runner's _work
      # checkouts, and docker build cache. image prune only frees unused images,
      # not these. Clean them every run so the host never accumulates to the
      # point of stalling mid-build. (No --volumes: pgdata must persist.)
      - name: Post-run host cleanup
        if: always()
        run: |
          set -euo pipefail
          docker image prune -af
          docker builder prune -af 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          pnpm store prune 2>/dev/null || true
          find "$RUNNER_WORKSPACE/.." -maxdepth 2 -type d -name node_modules -prune -exec rm -rf {} + 2>/dev/null || true
          df -h / | tail -1